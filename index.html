<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimik Perasmian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- KOD BAHARU: Enjin FontAwesome dipasang untuk memunculkan ikon Gunting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;700&display=swap');

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Prevent scrolling during animation */
        }

        .title-font {
            font-family: 'Cinzel', serif;
        }

        /* Perspective for 3D flying pieces effect */
        #scene {
            perspective: 1200px;
        }

        /* Style for individual puzzle pieces */
        .puzzle-piece {
            position: absolute;
            background-repeat: no-repeat;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            /* Initial state before JS takes over */
            opacity: 0; 
            border: 1px solid rgba(255,255,255,0.2);
            border-top: 2px solid rgba(255,255,255,0.6);
            border-left: 2px solid rgba(255,255,255,0.4);
            transform-style: preserve-3d;
        }

        /* Kesan pantulan cahaya cermin (Glare) */
        .puzzle-piece::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 60%);
            opacity: 0.9;
        }

        /* Glow effect for the final button */
        .glow-btn {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
            50% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.9), 0 0 10px rgba(255, 255, 255, 0.5); }
            100% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        }

        /* Final assembled image wrapper for seamless look */
        #final-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            z-index: 10;
            box-shadow: 0 0 50px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- Background particles/stars (Simple CSS) -->
    <div class="absolute inset-0 z-0 opacity-30 pointer-events-none" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 50px 50px;"></div>

    <!-- Header Text (Hidden initially) -->
    <div id="header-text" class="absolute top-16 md:top-20 z-20 text-center opacity-0">
        <!-- KOD BAHARU: Teks diletakkan siap-siap, disembunyikan menggunakan 'clip-path' untuk disapu dari kiri -->
        <h1 id="tajuk-baris-1" class="title-font text-3xl md:text-5xl lg:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-100 to-yellow-500 tracking-widest drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] min-h-[3rem] md:min-h-[4rem]" style="clip-path: inset(0 100% 0 0); -webkit-clip-path: inset(0 100% 0 0);">MAJLIS PELANCARAN</h1>
        <p id="tajuk-baris-2" class="mt-2 text-yellow-200 tracking-[0.2em] md:tracking-[0.3em] uppercase text-xs md:text-base drop-shadow-md min-h-[1.5rem]"></p>
    </div>

    <!-- 3D Scene Container -->
    <div id="scene" class="w-full max-w-5xl px-4 z-10 flex justify-center items-center h-[60vh] md:h-[70vh] mt-10 md:mt-12">
        <!-- The Puzzle Container -->
        <!-- Using aspect-video (16:9) which is standard for displays -->
        <div id="puzzle-container" class="relative w-full aspect-video max-w-4xl mx-auto rounded-lg shadow-2xl">
            <!-- Full seamless image (hidden until end to cover grid lines) -->
            <div id="final-image" class="rounded-lg border-2 border-yellow-500/50"></div>
            <!-- Pieces will be injected here via JS -->
        </div>
    </div>

    <!-- Gunting Tersuai (Custom Scissors Cursor) -->
    <div id="scissors-cursor" class="fixed top-0 left-0 z-[100] pointer-events-none opacity-0 transform -translate-x-6 -translate-y-6 text-6xl text-gray-200 drop-shadow-[0_8px_10px_rgba(0,0,0,0.7)] transition-opacity duration-200">
        <i class="fas fa-scissors transform -rotate-90"></i>
    </div>

    <!-- Reben Perasmian Satin 3D -->
    <div id="ribbon-container" class="absolute top-1/2 left-0 w-full h-40 z-30 flex items-center justify-center opacity-0 pointer-events-none cursor-none -translate-y-1/2">
        <div class="relative w-full max-w-6xl h-24 flex items-center justify-center">
            
            <!-- Tali Kiri (3D Satin Silk Effect) -->
            <div id="ribbon-left" class="w-1/2 h-12 shadow-[0_15px_25px_rgba(0,0,0,0.6)] origin-right z-10" style="background: linear-gradient(to bottom, #5a0000 0%, #b30000 20%, #ff1a1a 50%, #b30000 80%, #5a0000 100%); border-top: 1px solid #ff6666; border-bottom: 2px solid #330000;"></div>
            
            <!-- Bunga Tengah (Lipatan 3D Rosette Ribbon) -->
            <div id="ribbon-center" class="absolute z-20 w-32 h-32 rounded-full flex items-center justify-center animate-pulse" style="background: repeating-conic-gradient(from 0deg, #ff1a1a 0deg 15deg, #b30000 15deg 30deg); box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9); border: 2px solid #ff4d4d;">
                <!-- Lapisan Dalam Bunga -->
                <div class="w-20 h-20 rounded-full flex items-center justify-center" style="background: repeating-conic-gradient(from 10deg, #cc0000 0deg 20deg, #800000 20deg 40deg); box-shadow: inset 0 0 15px rgba(0,0,0,0.8);">
                    <!-- Butang Tengah Bunga -->
                    <div class="w-8 h-8 rounded-full" style="background: radial-gradient(circle, #ff6666 0%, #660000 100%); box-shadow: 0 2px 5px rgba(0,0,0,0.9);"></div>
                </div>
            </div>

            <!-- Tali Kanan (3D Satin Silk Effect) -->
            <div id="ribbon-right" class="w-1/2 h-12 shadow-[0_15px_25px_rgba(0,0,0,0.6)] origin-left z-10" style="background: linear-gradient(to bottom, #5a0000 0%, #b30000 20%, #ff1a1a 50%, #b30000 80%, #5a0000 100%); border-top: 1px solid #ff6666; border-bottom: 2px solid #330000;"></div>
            
            <!-- Teks Arahan -->
            <p id="ribbon-text" class="absolute -top-16 text-yellow-300 font-bold tracking-[0.2em] uppercase animate-bounce drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] text-sm md:text-2xl text-center w-full">Potong Reben Untuk Mulakan Pelancaran</p>
        </div>
    </div>

    <!-- Reset Button (Muncul Selepas Perasmian) -->
    <button id="reset-btn" class="absolute top-5 right-5 z-30 px-5 py-2.5 bg-gray-800/80 text-white rounded-full border border-gray-600 opacity-0 pointer-events-none transition-all hover:bg-gray-700 backdrop-blur-sm text-sm tracking-wider uppercase font-bold shadow-lg">
        &#8635; Ulang Semula
    </button>

    <!-- KOD BAHARU: Sistem Audio Gimik (Ditambah 'loop' supaya main tanpa henti) -->
    <audio id="audio-suspen" src="./muzik-gimik.mp3" preload="auto" loop></audio>
    <audio id="audio-tepukan" src="./bunyi-mercun.mp3" preload="auto" loop></audio>

    <script>
       // Konfigurasi
        const imageUrl = 'https://iili.io/nu022ja.png';
        const cols = 6; // Jumlah lajur puzzle
        const rows = 4; // Jumlah baris puzzle
        const puzzleContainer = document.getElementById('puzzle-container');
        const finalImage = document.getElementById('final-image');
        const ribbonContainer = document.getElementById('ribbon-container');
        const ribbonLeft = document.getElementById('ribbon-left');
        const ribbonRight = document.getElementById('ribbon-right');
        const ribbonCenter = document.getElementById('ribbon-center');
        const ribbonText = document.getElementById('ribbon-text');
        const scissorsCursor = document.getElementById('scissors-cursor');
        const resetBtn = document.getElementById('reset-btn');
        const headerText = document.getElementById('header-text');
        
        let pieces = [];
        let letupanBerterusan; // Pembolehubah untuk mengawal letupan tanpa henti

        // Penjejak Gunting (Berfungsi apabila mouse di atas reben)
        ribbonContainer.addEventListener('mousemove', (e) => {
            scissorsCursor.style.opacity = 1;
            scissorsCursor.style.left = e.clientX + 'px';
            scissorsCursor.style.top = e.clientY + 'px';
        });
        ribbonContainer.addEventListener('mouseleave', () => {
            scissorsCursor.style.opacity = 0;
        });

        // Tetapkan gambar akhir
        finalImage.style.backgroundImage = `url('${imageUrl}')`;

        // Pra-muat gambar untuk mengelakkan kelewatan
        const imgPreload = new Image();
        imgPreload.src = imageUrl;
        imgPreload.onload = () => {
            initPuzzle();
        };

        function initPuzzle() {
            const pieceWidth = 100 / cols;
            const pieceHeight = 100 / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece rounded-sm';
                    
                    // Saiz setiap kepingan (peratusan dari bekas utama)
                    piece.style.width = `${pieceWidth}%`;
                    piece.style.height = `${pieceHeight}%`;
                    
                    // Kedudukan sebenar (sasaran akhir)
                    const targetLeft = c * pieceWidth;
                    const targetTop = r * pieceHeight;
                    
                    piece.style.left = `${targetLeft}%`;
                    piece.style.top = `${targetTop}%`;

                    // Set gambar latar belakang
                    piece.style.backgroundImage = `url('${imageUrl}')`;
                    // Besarkan background supaya sama saiz dengan container asal
                    piece.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
                    
                    // Kedudukan background untuk memotong bahagian yang betul
                    const bgPosX = c * (100 / (cols - 1));
                    const bgPosY = r * (100 / (rows - 1));
                    piece.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;

                    puzzleContainer.appendChild(piece);
                    pieces.push(piece);

                    // Tetapkan kedudukan berterabur (rawak) di sekeliling skrin untuk permulaan
                    const randomX = (Math.random() - 0.5) * window.innerWidth * 1.5;
                    const randomY = (Math.random() - 0.5) * window.innerHeight * 1.5;
                    // KOD BAHARU: Putaran dinaikkan ke 1080 (3 pusingan penuh) supaya ia berpusing rancak di udara
                    const randomRotateX = (Math.random() - 0.5) * 1080;
                    const randomRotateY = (Math.random() - 0.5) * 1080;
                    const randomRotateZ = (Math.random() - 0.5) * 720;
                    const randomZ = Math.random() * 500 - 250; // Kedalaman 3D

                   gsap.set(piece, {
                        x: randomX,
                        y: randomY,
                        z: randomZ,
                        rotationX: randomRotateX,
                        rotationY: randomRotateY,
                        rotationZ: randomRotateZ,
                        opacity: 0,
                        scale: Math.random() * 0.5 + 0.5
                    });
                }
            }
            // Kepingan puzzle dibiarkan ghaib sepenuhnya (opacity: 0) sebelum butang ditekan

            // KOD BAHARU: Munculkan REBEN HANYA selepas semua kepingan sedia dan berterabur.
            ribbonContainer.classList.remove('opacity-0', 'pointer-events-none');
            gsap.fromTo(ribbonContainer, { opacity: 0 }, { opacity: 1, duration: 1 });
        }

        ribbonContainer.addEventListener('click', () => {
            // Matikan fungsi klik dan hilangkan gunting
            ribbonContainer.style.pointerEvents = 'none';
            scissorsCursor.style.opacity = 0; 
            
            // Sembunyikan teks arahan
            gsap.to(ribbonText, { opacity: 0, duration: 0.3 });

            // Animasi Reben Jatuh Terputus (Gunting efek)
            gsap.to(ribbonCenter, { scale: 0, opacity: 0, duration: 0.4, ease: 'back.in(2)' });
            gsap.to(ribbonLeft, { rotation: -45, y: window.innerHeight, opacity: 0, duration: 1.5, ease: 'power2.in', delay: 0.2 });
            gsap.to(ribbonRight, { rotation: 45, y: window.innerHeight, opacity: 0, duration: 1.5, ease: 'power2.in', delay: 0.2 });

            setTimeout(() => {
                ribbonContainer.style.opacity = 0;
            }, 1000);

            // KOD BAHARU: Mainkan muzik suspen/berdebar bermula sekarang
            const laguSuspen = document.getElementById('audio-suspen');
            if(laguSuspen) {
                laguSuspen.currentTime = 0;
                laguSuspen.play().catch(e => console.log("Menunggu MP3 dimuat naik"));
            }

            // Dedahkan bekas header terlebih dahulu
            gsap.to(headerText, { opacity: 1, duration: 0.5 });
            
            // KOD BAHARU: Efek Sapuan Cahaya Kiri-ke-Kanan (Cinematic Reveal).
            // Durasi diperlahankan kepada 15 SAAT diselaraskan tepat dengan durasi puzzle di bawah.
            gsap.to('#tajuk-baris-1', {
                clipPath: 'inset(0 0% 0 0)',
                webkitClipPath: 'inset(0 0% 0 0)',
                duration: 15, // 10 saat puzzle terbang + 5 saat stagger gelombang
                ease: 'power3.inOut' // Kuasa brek dilaras sama dengan kaca (seiring/sync)
            });

            // Mulakan animasi kemunculan dari ghaib berserta penyusunan yang sangat diperlahankan
            gsap.to('.puzzle-piece', {
                opacity: 1, // Kaca muncul dari ghaib
                x: 0,
                y: 0,
                z: 0,
                rotationX: 0, // Akan berpusing dari 1080 darjah kembali ke 0
                rotationY: 0,
                rotationZ: 0,
                scale: 1,
                duration: 10, // Kepingan terbang berpusing selama 10 saat penuh
                ease: 'power3.inOut', // Brek lembut di penghujung
                stagger: {
                    amount: 5, // Jarak masa gelombang dari kiri ke kanan ditambah kepada 5 saat
                    grid: [rows, cols],
                    from: "start" // Gelombang dari kiri ke kanan
                },
                onComplete: finalizeLaunch // Jumlah Total = 10 + 5 = 15 Saat
            });
        });

        function finalizeLaunch() {
            // 1. Pudarkan gambar penuh (seamless) supaya garisan potongan puzzle tidak kelihatan
            gsap.to(finalImage, {
                opacity: 1,
                duration: 1,
                ease: 'power2.inOut'
            });

            // KOD BAHARU: Mainkan bunyi tepukan gemuruh
            const laguTepukan = document.getElementById('audio-tepukan');
            if(laguTepukan) {
                laguTepukan.currentTime = 0;
                laguTepukan.play().catch(e => console.log("Menunggu MP3 dimuat naik"));
            }

            // 2. Tembak Letupan Bunga Api (Berterusan tanpa henti)
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            letupanBerterusan = setInterval(function() {
               // Tembak mercun/letupan rawak di pelbagai sudut skrin
                confetti(Object.assign({}, defaults, { 
                    particleCount: 50, 
                    origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 },
                    colors: ['#FFD700', '#FFA500', '#ff0000', '#ffffff'] 
                }));
            }, 500); // Meletup setiap 0.5 saat secara berterusan

            // Munculkan butang Ulang Semula dengan segera
            setTimeout(() => {
                resetBtn.style.pointerEvents = 'auto';
                gsap.to(resetBtn, { opacity: 1, duration: 1 });
            }, 1000);
        }

        // =========================================================================
        // KOD BAHARU: FUNGSI RESET PUZZLE KEMBALI KE ASAL
        // =========================================================================
        resetBtn.addEventListener('click', () => {
            // KOD BAHARU: Matikan semua muzik apabila diulang semula
            const laguSuspen = document.getElementById('audio-suspen');
            const laguTepukan = document.getElementById('audio-tepukan');
            if(laguSuspen) { laguSuspen.pause(); laguSuspen.currentTime = 0; }
            if(laguTepukan) { laguTepukan.pause(); laguTepukan.currentTime = 0; }
            
            // Hentikan letupan bunga api di latar belakang
            clearInterval(letupanBerterusan);

            // 1. Sembunyikan butang reset
            resetBtn.style.pointerEvents = 'none';
            gsap.to(resetBtn, { opacity: 0, duration: 0.5 });

            // 2. Pudarkan gambar penuh dan teks tajuk
            gsap.to(finalImage, { opacity: 0, duration: 1 });
            gsap.to(headerText, { opacity: 0, duration: 1 });
            
            // Set semula efek sapuan teks supaya tertutup kembali ke kiri
            setTimeout(() => {
                gsap.set('#tajuk-baris-1', { clipPath: 'inset(0 100% 0 0)', webkitClipPath: 'inset(0 100% 0 0)' });
                document.getElementById('tajuk-baris-2').innerHTML = '';
            }, 1000);

            // 3. Hamburkan semula kepingan puzzle ke tempat rawak & jadikan ghaib
            pieces.forEach(piece => {
                const randomX = (Math.random() - 0.5) * window.innerWidth * 1.5;
                const randomY = (Math.random() - 0.5) * window.innerHeight * 1.5;
                const randomRotateX = (Math.random() - 0.5) * 1080; // Sama seperti Lokasi 1
                const randomRotateY = (Math.random() - 0.5) * 1080;
                const randomRotateZ = (Math.random() - 0.5) * 720;
                const randomZ = Math.random() * 500 - 250;

                gsap.to(piece, {
                    x: randomX,
                    y: randomY,
                    z: randomZ,
                    rotationX: randomRotateX,
                    rotationY: randomRotateY,
                    rotationZ: randomRotateZ,
                    opacity: 0,
                    scale: Math.random() * 0.5 + 0.5,
                    duration: 1.5,
                    ease: 'power2.inOut'
                });
            });

            // 4. Munculkan dan kembalikan Reben di posisi asal
            setTimeout(() => {
                gsap.set(ribbonCenter, { scale: 1, opacity: 1 });
                gsap.set(ribbonLeft, { rotation: 0, y: 0, opacity: 1 });
                gsap.set(ribbonRight, { rotation: 0, y: 0, opacity: 1 });
                gsap.set(ribbonText, { opacity: 1 });
                
                ribbonContainer.style.pointerEvents = 'auto';
                gsap.to(ribbonContainer, { opacity: 1, duration: 1 });
            }, 1500);
        });
    </script>
</body>
</html>
